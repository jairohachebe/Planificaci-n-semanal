<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Plan Ciclos HC · Lucía y Jairo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ciclos HC">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#F7F7F5;
    --card:#FFFFFF;
    --ink:#1C1C1E;
    --ink-soft:#8A8A8E;
    --ink-mute:#B9B9BC;
    --line:rgba(60,60,67,0.10);
    --line-soft:rgba(60,60,67,0.06);

    --hc:#3F7B5A;
    --hc-soft:#E7F2EC;
    --hc-tint:#F3F9F6;

    --nohc:#B5622A;
    --nohc-soft:#FBEDE1;
    --nohc-tint:#FDF6F0;

    --track:#EEEEEC;
    --danger:#C0453A;
    --danger-soft:#FBEBE9;

    --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:0 2px 10px rgba(0,0,0,0.06);
    --shadow-lg:0 16px 40px rgba(0,0,0,0.14);
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:64px;
  }
  h1,h2,h3{margin:0; letter-spacing:-0.01em;}
  button{font-family:inherit;}

  header{
    position:sticky; top:0; z-index:30;
    background:rgba(247,247,245,0.82);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    padding:16px 18px 0 18px;
    border-bottom:1px solid var(--line-soft);
  }
  .title-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .title{
    font-size:21px;
    font-weight:700;
    letter-spacing:-0.02em;
    color:var(--ink);
  }
  .subtitle{
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:500;
  }

  /* Nav principal — segmented estilo iOS */
  .main-nav{
    display:flex;
    gap:3px;
    background:var(--track);
    padding:3px;
    border-radius:var(--radius-md);
    margin-bottom:10px;
  }
  .main-nav button{
    flex:1;
    padding:9px 8px;
    border-radius:11px;
    border:none;
    background:transparent;
    font-size:14px;
    font-weight:650;
    text-align:center;
    cursor:pointer;
    color:var(--ink-soft);
    transition:background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .main-nav button.active{
    background:#fff;
    color:var(--ink);
    box-shadow:var(--shadow-sm);
  }

  .mode-tabs{
    display:flex;
    gap:3px;
    background:var(--track);
    padding:3px;
    border-radius:var(--radius-md);
    margin-bottom:10px;
  }
  .mode-btn{
    flex:1;
    padding:9px 8px;
    border-radius:11px;
    border:none;
    background:transparent;
    font-size:13.5px;
    font-weight:650;
    text-align:center;
    cursor:pointer;
    color:var(--ink-soft);
    transition:background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .mode-btn .n{display:block; font-weight:500; font-size:10.5px; margin-top:1px; opacity:.7;}
  .mode-btn.active{ background:#fff; box-shadow:var(--shadow-sm); }
  .mode-btn.active[data-mode="con_hc"]{ color:var(--hc); }
  .mode-btn.active[data-mode="sin_hc"]{ color:var(--nohc); }

  .subbar{
    display:flex;
    gap:6px;
    padding-bottom:12px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .subbar::-webkit-scrollbar{display:none;}
  .meal-btn{
    flex:0 0 auto;
    white-space:nowrap;
    padding:8px 16px;
    border-radius:100px;
    border:1px solid var(--line);
    background:#fff;
    font-size:13px;
    font-weight:650;
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s ease;
  }
  .meal-btn.active{ background:var(--ink); border-color:var(--ink); color:#fff; }

  .controls{ padding:10px 18px 4px 18px; }
  .search-wrap{ position:relative; margin-bottom:10px; }
  .search-wrap svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.4; pointer-events:none; }
  .search{
    width:100%;
    padding:11px 12px 11px 36px;
    border-radius:var(--radius-sm);
    border:1px solid var(--line);
    background:#fff;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    box-shadow:var(--shadow-sm);
  }
  .search::placeholder{ color:var(--ink-mute); }
  .search:focus{ outline:none; border-color:rgba(60,60,67,0.2); box-shadow:0 0 0 3px rgba(0,0,0,0.04); }

  .person-row{
    display:flex;
    gap:3px;
    background:var(--track);
    padding:3px;
    border-radius:var(--radius-sm);
    margin-bottom:6px;
  }
  .person-btn{
    flex:1;
    padding:7px 6px;
    border-radius:8px;
    border:none;
    background:transparent;
    font-size:12.5px;
    font-weight:650;
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s ease;
  }
  .person-btn.active{ background:#fff; color:var(--ink); box-shadow:var(--shadow-sm); }

  main{ padding:14px 18px 0 18px; }

  /* ---------- Recetario: tarjetas ---------- */
  .recipe{
    background:var(--card);
    border:1px solid var(--line-soft);
    border-radius:var(--radius-lg);
    margin-bottom:12px;
    overflow:hidden;
    box-shadow:var(--shadow-sm);
    transition:box-shadow .2s ease, transform .15s ease;
  }
  .recipe:active{ transform:scale(0.994); }
  .recipe.is-open{ box-shadow:var(--shadow-md); }
  .recipe-photo{
    width:100%; aspect-ratio:3/2; object-fit:cover; display:block;
    background:var(--track);
  }
  .recipe-head{ padding:14px 16px 14px 16px; cursor:pointer; display:flex; flex-direction:column; gap:9px; }
  .recipe-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .recipe-name{ font-size:16px; font-weight:650; line-height:1.3; letter-spacing:-0.01em; color:var(--ink); }
  .chevron{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%;
    background:var(--track); display:flex; align-items:center; justify-content:center;
    transition:transform .25s ease, background .2s ease; margin-top:1px;
  }
  .recipe.is-open .chevron{ transform:rotate(180deg); background:#F0EEEA; }
  .meta-row{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .pill{ font-size:11.5px; padding:4px 10px; border-radius:100px; background:var(--hc-soft); color:var(--hc); font-weight:650; letter-spacing:-0.01em; }
  .recipe[data-cat="sin_hc"] .pill.macro{ background:var(--nohc-soft); color:var(--nohc); }
  .pill.time{ background:var(--track); color:var(--ink-soft); font-weight:500; }
  .kcal{ font-size:13.5px; font-weight:650; color:var(--ink); white-space:nowrap; }
  .kcal .u{ color:var(--ink-soft); font-weight:500; font-size:12px; }

  .recipe-body{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .28s cubic-bezier(.4,0,.2,1); }
  .recipe-body-inner{ overflow:hidden; }
  .recipe.is-open .recipe-body{ grid-template-rows:1fr; }
  .recipe-body-content{ padding:2px 16px 18px 16px; border-top:1px solid var(--line-soft); margin-top:2px; overflow:hidden; }
  .section-label{ font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-mute); margin:16px 0 8px 0; font-weight:700; }
  ul.ingredients{ list-style:none; margin:0; padding:0; }
  ul.ingredients li{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:14px; color:var(--ink); }
  ul.ingredients li:last-child{ border-bottom:none; }
  ul.ingredients .amt{ font-weight:650; white-space:nowrap; color:var(--ink); font-variant-numeric:tabular-nums; }
  ol.steps{ margin:0; padding-left:0; list-style:none; counter-reset:step; }
  ol.steps li{ font-size:14px; line-height:1.55; margin-bottom:10px; color:var(--ink); padding-left:28px; position:relative; counter-increment:step; }
  ol.steps li::before{
    content:counter(step); position:absolute; left:0; top:0; width:20px; height:20px; border-radius:50%;
    background:var(--track); color:var(--ink-soft); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .btn-assign{
    margin-top:14px; width:100%; padding:12px; border-radius:var(--radius-sm); border:none;
    background:var(--ink); color:#fff; font-size:14px; font-weight:650; cursor:pointer;
  }

  .empty{ text-align:center; color:var(--ink-soft); font-size:14.5px; padding:60px 20px; font-weight:500; }
  .footnote{ font-size:11.5px; color:var(--ink-mute); text-align:center; padding:22px 28px 0 28px; line-height:1.6; }

  /* ---------- Planificador ---------- */
  .week-nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:2px 2px 12px 2px;
  }
  .week-nav .arrow{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:var(--shadow-sm);
  }
  .week-label{ font-size:14.5px; font-weight:650; color:var(--ink); text-transform:capitalize; }
  .week-sub{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:1px; }

  .day-card{
    background:var(--card);
    border:1px solid var(--line-soft);
    border-radius:var(--radius-lg);
    margin-bottom:12px;
    box-shadow:var(--shadow-sm);
    overflow:hidden;
  }
  .day-card.is-today{ border-color:rgba(63,123,90,0.35); }
  .day-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px 10px 16px;
  }
  .day-head-left{ display:flex; align-items:center; gap:10px; }
  .day-dot{ width:8px; height:8px; border-radius:50%; background:var(--ink-mute); }
  .day-card.is-today .day-dot{ background:var(--hc); }
  .day-name{ font-size:15px; font-weight:700; color:var(--ink); text-transform:capitalize; }
  .day-date{ font-size:12px; color:var(--ink-soft); font-weight:500; }
  .day-kcal{ font-size:12.5px; font-weight:650; color:var(--ink-soft); }
  .day-kcal b{ color:var(--ink); font-weight:700; }
  .day-macros{ display:flex; gap:6px; padding:0 16px 12px 16px; margin-top:-2px; }
  .macro-pill{ font-size:11px; font-weight:650; padding:3px 9px; border-radius:100px; }
  .macro-pill.p{ background:#EAF1FB; color:#3D6FB4; }
  .macro-pill.c{ background:#FBF3E3; color:#B4863D; }
  .macro-pill.f{ background:#F7E9EC; color:#B4453D; }

  .meal-slot{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 16px;
    border-top:1px solid var(--line-soft);
    cursor:pointer;
  }
  .meal-slot:active{ background:var(--hc-tint); }
  .slot-left{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .slot-meal{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-mute); font-weight:700; }
  .slot-value{ font-size:14px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:56vw; }
  .slot-value.empty-slot{ color:var(--ink-mute); font-weight:500; }
  .slot-value.out{ color:var(--danger); }
  .slot-right{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .slot-kcal{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .slot-tag{ font-size:10px; font-weight:700; padding:2px 7px; border-radius:100px; }
  .slot-tag.con_hc{ background:var(--hc-soft); color:var(--hc); }
  .slot-tag.sin_hc{ background:var(--nohc-soft); color:var(--nohc); }

  /* ---------- Modal selector ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.32);
    z-index:100; display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.open{ display:flex; }
  .sheet{
    width:100%; max-width:560px; background:var(--bg);
    border-radius:24px 24px 0 0; max-height:88vh; display:flex; flex-direction:column;
    box-shadow:var(--shadow-lg);
    animation:sheet-up .25s cubic-bezier(.4,0,.2,1);
  }
  @keyframes sheet-up{ from{ transform:translateY(24px); opacity:.6; } to{ transform:translateY(0); opacity:1; } }
  .sheet-handle{ width:36px; height:4px; border-radius:3px; background:var(--line); margin:10px auto 6px auto; }
  .sheet-head{ padding:6px 18px 12px 18px; }
  .sheet-title{ font-size:16px; font-weight:700; margin-bottom:10px; }
  .sheet-actions{ display:flex; gap:8px; margin-bottom:10px; }
  .sheet-action-btn{
    flex:1; padding:10px; border-radius:var(--radius-sm); border:1px solid var(--line);
    background:#fff; font-size:13px; font-weight:650; cursor:pointer; color:var(--ink);
  }
  .sheet-action-btn.out{ color:var(--danger); border-color:rgba(192,69,58,0.25); background:var(--danger-soft); }
  .sheet-action-btn.clear{ color:var(--ink-soft); }
  .sheet-list{ overflow-y:auto; padding:0 18px 24px 18px; flex:1; }
  .sheet-recipe{
    display:flex; align-items:center; gap:10px;
    padding:9px; background:#fff; border:1px solid var(--line-soft); border-radius:var(--radius-md);
    margin-bottom:8px; cursor:pointer;
  }
  .sheet-recipe:active{ background:var(--hc-tint); }
  .sheet-recipe-photo{
    width:52px; height:52px; border-radius:10px; object-fit:cover; flex:0 0 auto; background:var(--track);
  }
  .sheet-recipe-text{ flex:1; min-width:0; }
  .sheet-recipe-name{ font-size:14px; font-weight:600; color:var(--ink); }
  .sheet-recipe-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .sheet-close{
    position:absolute; top:10px; right:14px; width:30px; height:30px; border-radius:50%;
    background:var(--track); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <div>
      <div class="title">Plan Ciclos HC</div>
      <div class="subtitle">Lucía &amp; Jairo · 1650 kcal cada uno</div>
    </div>
  </div>

  <div class="main-nav">
    <button id="navRecetario" class="active" onclick="setView('recipes')">Recetario</button>
    <button id="navPlanificador" onclick="setView('calendar')">Planificador</button>
  </div>

  <div id="recipeTabs">
    <div class="mode-tabs">
      <button class="mode-btn active" data-mode="con_hc" onclick="setMode('con_hc')">
        Días con HC
        <span class="n">21 recetas</span>
      </button>
      <button class="mode-btn" data-mode="sin_hc" onclick="setMode('sin_hc')">
        Días sin HC
        <span class="n">19 recetas</span>
      </button>
    </div>
    <div class="subbar" id="mealTabs"></div>
  </div>
</header>

<div class="controls" id="controlsBar">
  <div class="search-wrap" id="searchWrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search" id="searchBox" placeholder="Buscar por ingrediente o receta..." oninput="render()">
  </div>
  <div class="person-row" id="personRow"></div>
</div>

<main id="mainRecipes"></main>
<main id="mainCalendar" style="display:none;"></main>

<div class="footnote" id="footnoteRecipes">
  Cantidades para una ración. "Total" muestra la cantidad para Lucía + Jairo juntos (misma ración para los dos, ×2).
</div>

<!-- Modal selector de receta para el planificador -->
<div class="overlay" id="pickerOverlay" onclick="closePickerBg(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <button class="sheet-close" onclick="closePicker()">✕</button>
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle">Elegir receta</div>
      <div class="sheet-actions">
        <button class="sheet-action-btn out" onclick="assignSlot('OUT')">🚫 Fuera del plan</button>
        <button class="sheet-action-btn clear" onclick="assignSlot(null)">Vaciar</button>
      </div>
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search" id="sheetSearch" placeholder="Buscar receta..." oninput="renderSheetList()">
      </div>
    </div>
    <div class="sheet-list" id="sheetList"></div>
  </div>
</div>

 steps:['Prepara el aliño picando ajo y perejil finos, mezcla con aceite de oliva.','Seca bien los chipirones. Calienta la plancha a fuego alto.','Coloca los chipirones 1-2 min por lado hasta dorar. Añade el aliño, sal en escamas y limón.','Pela el pepino, corta en rodajas finas, aliña con aceite y sal.','Acompaña con patatas en dados al horno 25 min o airfryer 15 min.']},

 steps:['Lava el arroz de sushi y cocina según el paquete. Deja enfriar.','Mezcla salsa de soja, aceite de sésamo y vinagre de arroz. Marina el pollo en dados 15-20 min y cocina a la plancha.','Pela y corta pepino, aguacate y mango.','Coloca una base de arroz en un bol y añade los ingredientes por secciones.']},

 steps:['Precalentar el horno a 200°C (gas) o 180°C (ventilador).','Dar forma circular a la masa.','Lavar y picar la rúcula, picar el jamón.','Extender el tomate sobre la masa, sazonar con albahaca, sal y pimienta. Cubrir con parmesano y jamón.','Hornear 15-20 min hasta dorar. Decorar con rúcula antes de servir.']},

 steps:['Corta la berenjena en rodajas finas. Sala y deja reposar 10 min por lado para que suelte el amargor.','Precalienta la freidora de aire.','Bate el huevo en un bol.','Mezcla harina de almendra y parmesano con orégano en otro bol.','Reboza las berenjenas: primero en huevo, luego en la mezcla de harina y queso.','Cocina en airfryer 5 min por lado con un poco de aceite.','Añade salsa de tomate y queso rallado sobre cada rodaja.','Cocina 2 min más para que se derrita el queso.','Puedes acompañar con huevos fritos.']},

 steps:['Precalentar el horno a 220°C. Lavar los calabacines sin pelar. Rallar y escurrir bien el exceso de líquido.','Mezclar el calabacín con el queso rallado, aceite, huevos, orégano, levadura química y pimienta hasta homogeneizar.','Extender la masa sobre una bandeja con papel de horno, fina y uniforme.','Hornear en el medio 15-20 min hasta que esté ligeramente dorada.','Esparcir la salsa de tomate, cubrir con queso y jamón. Espolvorear orégano.','Hornear 15 min más hasta que el queso se derrita y dore.','Echar un poco de aceite de oliva y disfrutar.']},

 steps:['Corta el calabacín en tiras finas con pelador o mandolina.','Coloca dos tiras en cruz, rellena el centro con jamón y queso, cierra con el resto de tiras formando un saquito.','Bate el huevo y moja cada saquito.','Calienta el aceite en una sartén y fríe por ambos lados hasta dorar.','Corta por la mitad para servir en forma de minibikinis.']},

RECIPES.forEach((r,i)=>{ r.id = i; });

// ---------- ESTADO ----------
let state = {
  view: 'recipes',
  mode: 'con_hc',
  meal: 'desayuno',
  portion: 'individual', // individual | total
  search: '',
  open: {},
  weekStart: getMonday(new Date())
};

let plan = loadPlan();
let currentSlot = null; // {dateKey, meal}

// ---------- UTILIDADES ----------
function pad(n){ return n<10 ? '0'+n : ''+n; }
function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function getMonday(d){
  const date = new Date(d);
  const day = date.getDay(); // 0 = domingo
  const diff = (day === 0 ? -6 : 1 - day);
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}
function addDays(d, n){ const nd = new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function sameDate(a,b){ return dateKey(a)===dateKey(b); }
function loadPlan(){
  try{
    const raw = localStorage.getItem(PLAN_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function savePlan(){
  try{ localStorage.setItem(PLAN_KEY, JSON.stringify(plan)); }catch(e){}
}
function portionScale(q){ return state.portion==='individual' ? q : q*2; }
function fmt(n){ if(n===0) return ''; return Math.round(n).toString(); }

// ---------- NAV PRINCIPAL ----------
function setView(v){
  state.view = v;
  document.getElementById('navRecetario').classList.toggle('active', v==='recipes');
  document.getElementById('navPlanificador').classList.toggle('active', v==='calendar');
  document.getElementById('recipeTabs').style.display = v==='recipes' ? '' : 'none';
  document.getElementById('searchWrap').style.display = v==='recipes' ? '' : 'none';
  document.getElementById('personRow').style.display = v==='recipes' ? '' : 'none';
  document.getElementById('controlsBar').style.display = v==='recipes' ? '' : 'none';
  document.getElementById('mainRecipes').style.display = v==='recipes' ? '' : 'none';
  document.getElementById('mainCalendar').style.display = v==='calendar' ? '' : 'none';
  document.getElementById('footnoteRecipes').style.display = v==='recipes' ? '' : 'none';
  if(v==='recipes'){ buildTabs(); render(true); }
  else{ renderCalendar(); }
}

function setMode(m){
  state.mode = m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode===m));
  render();
}
function setMeal(m){
  state.meal = m;
  document.querySelectorAll('.meal-btn').forEach(b=>b.classList.toggle('active', b.dataset.meal===m));
  render();
}
function setPortion(p){
  state.portion = p;
  document.querySelectorAll('.person-btn').forEach(b=>b.classList.toggle('active', b.dataset.person===p));
  if(state.view==='recipes') render(true); else renderCalendar();
}
function toggleOpen(id){
  state.open[id] = !state.open[id];
  render(true);
}

function buildTabs(){
  const mealBar = document.getElementById('mealTabs');
  mealBar.innerHTML = Object.keys(MEAL_LABELS).map(m=>
    `<button class="meal-btn ${m===state.meal?'active':''}" data-meal="${m}" onclick="setMeal('${m}')">${MEAL_LABELS[m]}</button>`
  ).join('');

  const personRow = document.getElementById('personRow');
  const labels = {individual:'Individual', total:'Total'};
  personRow.innerHTML = Object.keys(labels).map(p=>
    `<button class="person-btn ${p===state.portion?'active':''}" data-person="${p}" onclick="setPortion('${p}')">${labels[p]}</button>`
  ).join('');
}

function matchesSearch(recipe, term){
  if(!term) return true;
  term = term.toLowerCase();
  if(recipe.name.toLowerCase().includes(term)) return true;
  return recipe.ing.some(i=>i.n.toLowerCase().includes(term));
}

// ---------- RECETARIO ----------
function render(skipTabs){
  if(!skipTabs) buildTabs();
  state.search = document.getElementById('searchBox').value;
  const list = document.getElementById('mainRecipes');
  const term = state.search;
  const items = RECIPES.filter(r=>r.cat===state.mode && r.meal===state.meal && matchesSearch(r, term));

  if(items.length===0){
    list.innerHTML = '<div class="empty">No hay recetas que coincidan con la búsqueda.</div>';
    return;
  }

  list.innerHTML = items.map(r=>{
    const isOpen = !!state.open[r.id];
    const kcal = Math.round(portionScale(r.kcal));
    const p = Math.round(portionScale(r.p));
    const c = Math.round(portionScale(r.c));
    const f = Math.round(portionScale(r.f));

    const ingHtml = r.ing.map(i=>{
      if(i.noScale || i.u===''){
        return `<li><span>${i.n}${i.note?' <span style="color:var(--ink-mute)">('+i.note+')</span>':''}</span><span class="amt">${i.note||''}</span></li>`;
      }
      const amt = fmt(portionScale(i.q));
      return `<li><span>${i.n}${i.note?' <span style="color:var(--ink-mute)">('+i.note+')</span>':''}</span><span class="amt">${amt}${i.u}</span></li>`;
    }).join('');

    const stepsHtml = r.steps.map(s=>`<li>${s}</li>`).join('');
    const portionLabel = state.portion==='individual' ? 'ración individual' : 'total (Lucía + Jairo)';

    return `
    <div class="recipe ${isOpen?'is-open':''}" data-cat="${r.cat}">
      <img class="recipe-photo" src="${r.img}" alt="${r.name}" loading="lazy">
      <div class="recipe-head" onclick="toggleOpen(${r.id})">
        <div class="recipe-top">
          <div class="recipe-name">${r.name}</div>
          <div class="chevron">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
        <div class="meta-row">
          <span class="pill time">⏱ ${r.time}</span>
          <span class="pill macro">P ${p}g</span>
          <span class="pill macro">C ${c}g</span>
          <span class="pill macro">G ${f}g</span>
        </div>
        <div class="kcal">${kcal} <span class="u">kcal · ${portionLabel}</span></div>
      </div>
      <div class="recipe-body">
        <div class="recipe-body-content">
          <div class="section-label">Ingredientes</div>
          <ul class="ingredients">${ingHtml}</ul>
          <div class="section-label">Preparación</div>
          <ol class="steps">${stepsHtml}</ol>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ---------- PLANIFICADOR ----------
function shiftWeek(n){
  state.weekStart = addDays(state.weekStart, n*7);
  renderCalendar();
}

function weekRangeLabel(){
  const start = state.weekStart;
  const end = addDays(start, 6);
  const sameMonth = start.getMonth()===end.getMonth();
  const startStr = start.getDate()+(sameMonth?'':' '+MONTH_NAMES[start.getMonth()]);
  const endStr = end.getDate()+' '+MONTH_NAMES[end.getMonth()];
  return `${startStr} – ${endStr}`;
}

function slotValue(dk, meal){
  return plan[dk] && plan[dk][meal] !== undefined ? plan[dk][meal] : null;
}

function dayTotals(dk){
  let kcal=0, p=0, c=0, f=0;
  ['desayuno','comida','cena'].forEach(m=>{
    const v = slotValue(dk, m);
    if(typeof v === 'number'){
      const r = RECIPES[v];
      if(r){ kcal+=r.kcal; p+=r.p; c+=r.c; f+=r.f; }
    }
  });
  return {kcal:Math.round(kcal), p:Math.round(p), c:Math.round(c), f:Math.round(f)};
}

function renderCalendar(){
  const today = new Date();
  const container = document.getElementById('mainCalendar');
  let html = `
    <div class="week-nav">
      <div class="arrow" onclick="shiftWeek(-1)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <div>
        <div class="week-label">${weekRangeLabel()}</div>
        <div class="week-sub">Toca una comida para planificarla</div>
      </div>
      <div class="arrow" onclick="shiftWeek(1)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>
  `;

  for(let i=0;i<7;i++){
    const d = addDays(state.weekStart, i);
    const dk = dateKey(d);
    const isToday = sameDate(d, today);
    const t = dayTotals(dk);
    const hasPlan = t.kcal > 0;

    html += `<div class="day-card ${isToday?'is-today':''}">
      <div class="day-head">
        <div class="day-head-left">
          <span class="day-dot"></span>
          <div>
            <div class="day-name">${DAY_NAMES[i]}</div>
            <div class="day-date">${d.getDate()} de ${MONTH_NAMES[d.getMonth()]}</div>
          </div>
        </div>
        <div class="day-kcal">${hasPlan?`<b>${t.kcal}</b> kcal`:''}</div>
      </div>
      ${hasPlan ? `<div class="day-macros">
        <span class="macro-pill p">P ${t.p}g</span>
        <span class="macro-pill c">C ${t.c}g</span>
        <span class="macro-pill f">G ${t.f}g</span>
      </div>` : ''}`;

    ['desayuno','comida','cena'].forEach(meal=>{
      const v = slotValue(dk, meal);
      let valueHtml, kcalHtml='', tagHtml='';
      if(v === 'OUT'){
        valueHtml = `<span class="slot-value out">🚫 Fuera del plan</span>`;
      } else if(typeof v === 'number' && RECIPES[v]){
        const r = RECIPES[v];
        valueHtml = `<span class="slot-value">${r.name}</span>`;
        kcalHtml = `<span class="slot-kcal">${Math.round(r.kcal)} kcal</span>`;
        tagHtml = `<span class="slot-tag ${r.cat}">${r.cat==='con_hc'?'Con HC':'Sin HC'}</span>`;
      } else {
        valueHtml = `<span class="slot-value empty-slot">Elegir receta</span>`;
      }
      html += `<div class="meal-slot" onclick="openPicker('${dk}','${meal}')">
        <div class="slot-left">
          <span class="slot-meal">${MEAL_LABELS[meal]}</span>
          ${valueHtml}
        </div>
        <div class="slot-right">${tagHtml}${kcalHtml}</div>
      </div>`;
    });

    html += `</div>`;
  }

  container.innerHTML = html;
}

// ---------- MODAL SELECTOR ----------
function openPicker(dk, meal){
  currentSlot = {dateKey:dk, meal};
  document.getElementById('sheetTitle').textContent = `${MEAL_LABELS[meal]} · ${dk.split('-').reverse().join('/')}`;
  document.getElementById('sheetSearch').value = '';
  renderSheetList();
  document.getElementById('pickerOverlay').classList.add('open');
}
function closePicker(){
  document.getElementById('pickerOverlay').classList.remove('open');
  currentSlot = null;
}
function closePickerBg(e){
  if(e.target.id === 'pickerOverlay') closePicker();
}
function renderSheetList(){
  if(!currentSlot) return;
  const term = document.getElementById('sheetSearch').value.toLowerCase();
  const items = RECIPES.filter(r=> r.meal===currentSlot.meal && (!term || r.name.toLowerCase().includes(term) || r.ing.some(i=>i.n.toLowerCase().includes(term))));
  const list = document.getElementById('sheetList');
  if(items.length===0){
    list.innerHTML = '<div class="empty">Sin resultados.</div>';
    return;
  }
  list.innerHTML = items.map(r=>`
    <div class="sheet-recipe" onclick="assignSlot(${r.id})">
      <img class="sheet-recipe-photo" src="${r.img}" alt="${r.name}" loading="lazy">
      <div class="sheet-recipe-text">
        <div class="sheet-recipe-name">${r.name}</div>
        <div class="sheet-recipe-meta">${Math.round(r.kcal)} kcal · ${r.cat==='con_hc'?'Con HC':'Sin HC'}</div>
      </div>
      <span class="slot-tag ${r.cat}">${r.cat==='con_hc'?'HC':'Sin HC'}</span>
    </div>
  `).join('');
}
function assignSlot(value){
  if(!currentSlot) return;
  const {dateKey:dk, meal} = currentSlot;
  if(!plan[dk]) plan[dk] = {};
  if(value === null){ delete plan[dk][meal]; if(Object.keys(plan[dk]).length===0) delete plan[dk]; }
  else{ plan[dk][meal] = value; }
  savePlan();
  closePicker();
  renderCalendar();
}

// ---------- INIT ----------
buildTabs();
render(true);
</script>
</body>
</html>
